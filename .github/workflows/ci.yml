name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The e2e config starts the BE from ../frequency-be, so check both repos out side by side
      - uses: actions/checkout@v4
        with:
          path: frequency
      - uses: actions/checkout@v4
        with:
          repository: duckervp/frequency-be
          path: frequency-be
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frequency/package-lock.json
            frequency-be/package-lock.json
      - run: npm ci
        working-directory: frequency-be
      - run: npm ci
        working-directory: frequency
      - run: npx playwright install --with-deps chromium
        working-directory: frequency
      - run: npm run lint
        working-directory: frequency
      - run: npm run build
        working-directory: frequency
      - run: npm run test:e2e
        working-directory: frequency
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frequency/playwright-report
            frequency/test-results
          retention-days: 7
