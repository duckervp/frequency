    <title>Frequency App</title>
    <!-- Include Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- icon_names is filled in from src/lib/icons.ts by vite.config.ts -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&icon_names=%MATERIAL_ICONS%&display=block" rel="stylesheet">
  </head>

  </body>
